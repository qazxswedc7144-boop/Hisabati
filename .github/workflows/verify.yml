name: Verify
on:
  push:
    branches: ['fix/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint (tsc --noEmit)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
