name: Verify
on:
  workflow_dispatch:
  push:
    branches: ['fix/**', 'feat/**', 'main', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'
      - name: Pin npm version
        run: npm install --global npm@10.9.2
      - name: Install
        run: npm ci --include=optional
      - name: Lint (tsc --noEmit)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
