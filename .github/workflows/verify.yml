name: Verify
on:
  workflow_dispatch:
  push:
    branches: ['fix/**', 'feat/**', 'main', 'chore/**', 'security/**']
    paths-ignore: ['package.json']
  pull_request:
    branches: [main]
    paths-ignore: ['package.json']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --include=optional
      - name: Lint (tsc --noEmit)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
