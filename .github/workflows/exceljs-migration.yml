name: ExcelJS Migration Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-exceljs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-dependency-remediation-2026-11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Generate lockfile for the reviewed manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate Bun lockfile
        run: bun install --lockfile-only
      - name: Install from generated lockfile
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Capture remaining audit findings
        run: npm audit --json > npm-audit-after-exceljs.json || true
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-after-exceljs
          path: npm-audit-after-exceljs.json
          retention-days: 14
      - name: Commit verified lockfile
        run: |
          if ! git diff --quiet -- package-lock.json bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json bun.lock
            git commit -m "build(deps): lock ExcelJS migration"
            git fetch origin fix/security-dependency-remediation-2026-11
            git rebase origin/fix/security-dependency-remediation-2026-11
            git push origin HEAD:fix/security-dependency-remediation-2026-11
          else
            echo "Lockfile already matches package.json"
          fi
