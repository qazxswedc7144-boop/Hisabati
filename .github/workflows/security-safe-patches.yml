name: Security Safe Dependency Patches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-dependency-remediation-2026-11
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Pin npm version
        run: npm install --global npm@10.9.2
      - name: Install reviewed lockfile
        run: npm ci
      - name: Apply semver-compatible audit fixes only
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Reinstall from updated lockfile
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Capture audit report
        run: npm audit --json > npm-audit-after-safe-patches.json || true
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-after-safe-patches.json
          retention-days: 14
      - name: Commit verified lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(security): apply verified compatible dependency patches"
            git fetch origin fix/security-dependency-remediation-2026-11
            git rebase origin/fix/security-dependency-remediation-2026-11
            git push origin HEAD:fix/security-dependency-remediation-2026-11
          fi
