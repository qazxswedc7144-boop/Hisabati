name: Security Safe Dependency Patches
on:
  push:
    branches:
      - 'fix/security-dependency-remediation-2026-11'
    paths:
      - '.github/workflows/security-safe-patches.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-dependency-remediation-2026-11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile for reviewed package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh compatible Google Cloud Firestore dependency chain
        run: npm update --package-lock-only @google-cloud/firestore google-gax
      - name: Install current lockfile
        run: npm ci
      - name: Apply semver-compatible audit fixes only
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Reinstall from updated lockfile
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Capture remaining audit findings
        run: npm audit --json > npm-audit-after-safe-patches.json || true
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-after-safe-patches
          path: npm-audit-after-safe-patches.json
          retention-days: 14
      - name: Commit lockfile only after verification
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No semver-compatible lockfile updates available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): apply verified compatible dependency patches"
          git fetch origin fix/security-dependency-remediation-2026-11
          git rebase origin/fix/security-dependency-remediation-2026-11
          git push origin HEAD:fix/security-dependency-remediation-2026-11
